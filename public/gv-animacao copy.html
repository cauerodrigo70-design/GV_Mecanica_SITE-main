<title>GV Mecânica Diesel e Auto Peças - Animação</title>

<!-- ============================================================
     1) CSS DA INTRO  (copie este bloco para o <head> do seu site)
     ============================================================ -->
<style>
  html.gv-lock, html.gv-lock body { overflow: hidden; }

  #gv-intro {
    position: fixed; inset: 0; z-index: 2147483000;
    overflow: hidden; cursor: pointer;
    --gv-navy: #292e40; --gv-red: #e31f25; --gv-white: #fcfcfd;
    --gv-tw: clamp(230px, 28vw, 440px);                              /* largura do caminhão */
    --gv-edge: calc(clamp(28px, 5vw, 90px) + clamp(4px, .7vw, 12px)); /* faixa vermelha + fio branco */
    --gv-off: calc(var(--gv-tw) + var(--gv-edge) + 3vw);             /* recuo extra: caminhão começa fora da tela */
  }

  /* Painel azul-escuro que cobre o site e sai deslizando na diagonal */
  #gv-intro .gv-panel {
    position: absolute; top: -5vh; bottom: -5vh; left: calc(-3vw - 14vh - var(--gv-off)); width: calc(106vw + 28vh + var(--gv-off));
    background: var(--gv-navy);
    transform: translateX(0) skewX(-14deg);
  }
  /* Faixa vermelha + fio branco na borda do painel (lembra a barra da logo) */
  #gv-intro .gv-edge {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: clamp(28px, 5vw, 90px); background: var(--gv-red);
  }
  #gv-intro .gv-edge::after {
    content: ""; position: absolute; left: 100%; top: 0; bottom: 0;
    width: clamp(4px, .7vw, 12px); background: var(--gv-white);
  }

  /* Caminhão: vai "preso" ao painel, então anda junto com a cortina.
     O skew contrário desfaz a inclinação do painel. */
  #gv-intro .gv-truck {
    position: absolute; bottom: 14vh; overflow: visible;
    left: calc(var(--gv-edge) + 1.5vw);
    width: var(--gv-tw); height: auto;
    transform: skewX(14deg);
  }
  #gv-intro .gv-wheel { transform-box: fill-box; transform-origin: 50% 50%; }
  #gv-intro .gv-smoke { fill: #cfd4de; opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; }

  #gv-intro .gv-stage { position: absolute; inset: 0; display: grid; place-items: center; }
  #gv-intro .gv-logo { width: min(88vw, 880px); height: auto; overflow: visible; }

  #gv-intro .gv-red { fill: var(--gv-red); }
  #gv-intro .gv-wht { fill: var(--gv-white); }

  /* Botão de som */
  #gv-intro .gv-snd {
    position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 5;
    display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    font: 600 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--gv-white); background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.28); border-radius: 999px; cursor: pointer;
    transition: opacity .3s;
  }
  #gv-intro .gv-snd:hover { background: rgba(255,255,255,.16); }
  #gv-intro .gv-snd-txt:empty { display: none; }
  #gv-intro .gv-snd.gv-snd-hint { animation: gvHint 1.4s ease-in-out infinite; }
  #gv-intro.gv-exit .gv-snd { opacity: 0; pointer-events: none; }

  /* ---------- Estado inicial (tudo escondido) ---------- */
  #gv-intro .gv-gv {
    fill: var(--gv-white); fill-opacity: 0;
    stroke: var(--gv-white); stroke-width: 2.4; stroke-linejoin: round;
    stroke-dasharray: 1; stroke-dashoffset: 1;
  }
  #gv-intro .gv-slash { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); }
  #gv-intro .gv-bar   { transform-box: fill-box; transform-origin: 0 50%;    transform: scaleX(0); }
  #gv-intro .gv-ltr   { opacity: 0; transform: translateY(18px); }
  #gv-intro .gv-gear  { transform-box: fill-box; transform-origin: 50% 50%; scale: 0; opacity: 0; }

  #gv-intro .gv-r1 { --d: 1000ms; }
  #gv-intro .gv-r2 { --d: 1150ms; }
  #gv-intro .gv-r3 { --d: 1300ms; }

  /* ---------- Animação de entrada ---------- */
  #gv-intro.gv-run .gv-logo  { animation: gvSettle 2600ms ease-out forwards; }
  #gv-intro.gv-run .gv-gv    { animation: gvDraw 850ms 150ms cubic-bezier(.65,0,.35,1) forwards,
                                          gvFill 500ms 600ms ease-out forwards; }
  #gv-intro.gv-run .gv-slash { animation: gvRise 520ms 550ms cubic-bezier(.2,.8,.2,1) forwards; }
  #gv-intro.gv-run .gv-bar   { animation: gvSweep 560ms 850ms cubic-bezier(.6,0,.2,1) forwards; }
  #gv-intro.gv-run .gv-ltr   { animation: gvLtr 450ms calc(var(--d) + var(--i) * 45ms) cubic-bezier(.2,.8,.2,1) forwards; }

  /* Engrenagens: aparecem com um "pulinho" e giram (as pequenas giram mais rápido e ao contrário) */
  #gv-intro.gv-run .gv-g1 { animation: gvPop 600ms 1100ms cubic-bezier(.34,1.56,.64,1) forwards,
                                       gvSpinA 1900ms 1100ms cubic-bezier(.2,.7,.3,1) forwards; }
  #gv-intro.gv-run .gv-g2 { animation: gvPop 600ms 1250ms cubic-bezier(.34,1.56,.64,1) forwards,
                                       gvSpinB 1900ms 1250ms cubic-bezier(.2,.7,.3,1) forwards; }
  #gv-intro.gv-run .gv-g3 { animation: gvPop 600ms 1350ms cubic-bezier(.34,1.56,.64,1) forwards,
                                       gvSpinC 1900ms 1350ms cubic-bezier(.2,.7,.3,1) forwards; }

  /* ---------- Saída: logo some, o caminhão passa puxando a cortina e revela o site ---------- */
  #gv-intro.gv-exit { pointer-events: none; }
  #gv-intro.gv-exit .gv-stage { animation: gvOut 520ms cubic-bezier(.4,0,1,1) forwards; }
  #gv-intro.gv-exit .gv-panel { animation: gvWipe 2200ms 300ms cubic-bezier(.4,0,.5,1) forwards; }
  #gv-intro.gv-exit .gv-wheel  { animation: gvWheel 420ms linear infinite; }
  #gv-intro.gv-exit .gv-tbody  { animation: gvBounce 240ms ease-in-out infinite alternate; }
  #gv-intro.gv-exit .gv-smoke  { animation: gvSmoke 900ms calc(var(--s) * 300ms) ease-out infinite; }

  @keyframes gvSettle { from { transform: scale(.94); } to { transform: scale(1); } }
  @keyframes gvDraw   { to { stroke-dashoffset: 0; } }
  @keyframes gvFill   { to { fill-opacity: 1; stroke-opacity: 0; } }
  @keyframes gvRise   { to { transform: scaleY(1); } }
  @keyframes gvSweep  { to { transform: scaleX(1); } }
  @keyframes gvLtr    { to { opacity: 1; transform: none; } }
  @keyframes gvPop    { to { scale: 1; opacity: 1; } }
  @keyframes gvSpinA  { from { rotate: 0deg; } to { rotate: 120deg; } }
  @keyframes gvSpinB  { from { rotate: 0deg; } to { rotate: -163deg; } }
  @keyframes gvSpinC  { from { rotate: 0deg; } to { rotate: -202deg; } }
  @keyframes gvOut    { to { opacity: 0; transform: scale(1.06); } }
  @keyframes gvWipe   { to { transform: translateX(calc(106vw + 28vh + var(--gv-off))) skewX(-14deg); } }
  @keyframes gvWheel  { to { transform: rotate(360deg); } }
  @keyframes gvBounce { from { transform: translateY(0); } to { transform: translateY(-1.8px); } }
  @keyframes gvSmoke  { 0% { opacity: .55; transform: translate(0,0) scale(.6); }
                        100% { opacity: 0; transform: translate(-70px,-34px) scale(3); } }
  @keyframes gvHint   { 0%,100% { box-shadow: 0 0 0 0 rgba(227,31,37,.7); }
                        50% { box-shadow: 0 0 0 9px rgba(227,31,37,0); } }
</style>
<noscript><style>#gv-intro { display: none !important; }</style></noscript>

<script>
(function () {
  var CONFIG = {
    sound: true,                 // false = sem nenhum som
    volume: 0.3,                 // volume geral do som (0 a 1)
    respectReducedMotion: false, // true = pula a intro se o sistema tiver animações reduzidas
    once: false,                 // true = só mostra a intro na 1ª visita da sessão
    minShow: 2400,               // ms de animação antes da transição de saída
    maxWait: 6000                // espera máxima pelo carregamento do site
  };
  // tempos da saída (ms, contados a partir do início da transição)
  var T = { enter: 850, leave: 1950, finish: 2650 };

  /* ===================== SONS (gerados no código, sem arquivos) ===================== */
  var SOUND = (function () {
    var fx = {};

    function noise(c) {
      if (!c._gvNoise) {
        var len = c.sampleRate * 2, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        c._gvNoise = b;
      }
      var s = c.createBufferSource(); s.buffer = c._gvNoise; s.loop = true; return s;
    }

    // "Fuum" suave: ruído filtrado que sobe devagar e some
    fx.whoosh = function (c, out, t, dur, f0, f1, vol) {
      var n = noise(c), f = c.createBiquadFilter(), g = c.createGain();
      f.type = 'bandpass'; f.Q.value = 0.7;
      f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.5);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      n.connect(f); f.connect(g); g.connect(out);
      n.start(t); n.stop(t + dur + 0.05);
    };

    // "Tic" macio de engrenagem
    fx.tick = function (c, out, t, p, vol) {
      var o = c.createOscillator(), g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(1500 * p, t); o.frequency.exponentialRampToValueAtTime(900 * p, t + 0.06);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.1);
      var n = noise(c), f = c.createBiquadFilter(), ng = c.createGain();
      f.type = 'highpass'; f.frequency.value = 3000;
      ng.gain.setValueAtTime(vol * 0.25, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.02);
      n.connect(f); f.connect(ng); ng.connect(out); n.start(t); n.stop(t + 0.03);
    };

    // Pancada grave e curta
    fx.thump = function (c, out, t, vol) {
      var o = c.createOscillator(), g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.28);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.45);
    };

    // "Ding" suave quando a logo fica completa
    fx.chime = function (c, out, t, vol) {
      [[659, 1], [988, 0.5]].forEach(function (p) {
        var o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = p[0];
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol * p[1], t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
        o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.95);
      });
    };

    // Motor diesel: ronco grave e macio, sobe quando o caminhão chega,
    // passa de um lado pro outro (estéreo) e some.
    fx.engine = function (c, out, t0, tIn, tOut, t1) {
      var tMid = (tIn + tOut) / 2;
      var amp = c.createGain();
      amp.gain.setValueAtTime(0.0001, t0);
      amp.gain.linearRampToValueAtTime(0.25, tIn);
      amp.gain.linearRampToValueAtTime(0.7, tMid);
      amp.gain.linearRampToValueAtTime(0.25, tOut);
      amp.gain.linearRampToValueAtTime(0.0001, t1);

      var lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.7;
      lp.frequency.setValueAtTime(130, t0);
      lp.frequency.linearRampToValueAtTime(380, tMid);
      lp.frequency.linearRampToValueAtTime(180, t1);

      var base = c.createGain(); base.gain.value = 0.6;
      var chug = c.createGain(); chug.gain.value = 0.3;
      var lfo = c.createOscillator(); lfo.type = 'sine';
      lfo.frequency.setValueAtTime(6, t0);
      lfo.frequency.linearRampToValueAtTime(12, tMid);
      lfo.frequency.linearRampToValueAtTime(9, t1);
      lfo.connect(chug); chug.connect(base.gain);

      [[1, 'sawtooth', 0.45], [0.5, 'sine', 0.9], [2, 'triangle', 0.12]].forEach(function (p) {
        var o = c.createOscillator(), g = c.createGain();
        o.type = p[1]; g.gain.value = p[2];
        o.frequency.setValueAtTime(38 * p[0], t0);
        o.frequency.linearRampToValueAtTime(62 * p[0], tMid);
        o.frequency.linearRampToValueAtTime(52 * p[0], t1);
        o.connect(g); g.connect(base); o.start(t0); o.stop(t1 + 0.1);
      });

      var n = noise(c), nf = c.createBiquadFilter(), ng = c.createGain();
      nf.type = 'bandpass'; nf.frequency.value = 110; nf.Q.value = 0.8; ng.gain.value = 0.15;
      n.connect(nf); nf.connect(ng); ng.connect(base); n.start(t0); n.stop(t1 + 0.1);

      base.connect(lp); lp.connect(amp);
      if (c.createStereoPanner) {
        var pan = c.createStereoPanner();
        pan.pan.setValueAtTime(-0.8, t0);
        pan.pan.setValueAtTime(-0.8, tIn);
        pan.pan.linearRampToValueAtTime(0.8, tOut);
        amp.connect(pan); pan.connect(out);
      } else { amp.connect(out); }
      lfo.start(t0); lfo.stop(t1 + 0.1);
    };

    // Buzina: dois toques curtos e suaves
    fx.horn = function (c, out, t) {
      var g = c.createGain(), lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 1000;
      g.gain.setValueAtTime(0.0001, t);
      [0, 0.34].forEach(function (off) {
        g.gain.setValueAtTime(0.0001, t + off);
        g.gain.linearRampToValueAtTime(0.14, t + off + 0.03);
        g.gain.setValueAtTime(0.14, t + off + 0.2);
        g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.29);
      });
      [[311, 'triangle', 1], [392, 'triangle', 1], [622, 'sawtooth', 0.1]].forEach(function (p) {
        var o = c.createOscillator(), og = c.createGain();
        o.type = p[1]; og.gain.value = p[2]; o.frequency.value = p[0];
        o.connect(og); og.connect(lp); o.start(t); o.stop(t + 0.75);
      });
      lp.connect(g); g.connect(out);
    };

    /* ---- controle em tempo real ---- */
    var ctx = null, master = null, bus = null, muted = false;

    function init() {
      if (ctx || !CONFIG.sound) return;
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = muted ? 0 : CONFIG.volume;
        master.connect(ctx.destination);
      } catch (e) { ctx = null; }
    }
    function newBus() { if (ctx) { bus = ctx.createGain(); bus.connect(master); } }
    function running() { return !!ctx && ctx.state === 'running'; }
    function play(fn) {                       // só toca se o navegador já liberou o áudio
      if (!running() || !bus) return;
      try { fn(ctx, bus, ctx.currentTime + 0.02); } catch (e) {}
    }
    function fadeOut() {
      if (!ctx || !bus) return;
      var b = bus; bus = null;
      try { b.gain.setTargetAtTime(0, ctx.currentTime, 0.05); } catch (e) {}
      setTimeout(function () { try { b.disconnect(); } catch (e) {} }, 700);
    }
    function resume() { return ctx && ctx.state !== 'running' ? ctx.resume().catch(function () {}) : Promise.resolve(); }
    function setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : CONFIG.volume; }

    return {
      fx: fx, init: init, newBus: newBus, running: running, play: play, fadeOut: fadeOut,
      resume: resume, setMuted: setMuted,
      isMuted: function () { return muted; },
      available: function () { return !!ctx; },
      onState: function (cb) { if (ctx) ctx.onstatechange = cb; }
    };
  })();

  // [quando (ms), som, parâmetros]
  var INTRO_SOUNDS = [
    [150,  'whoosh', [0.9, 160, 1100, 0.20]],    // G e V sendo desenhados
    [620,  'thump',  [0.5]],                     // G e V preenchidos
    [850,  'whoosh', [0.55, 220, 1800, 0.26]],   // barra vermelha corre
    [1000, 'tick', [1.6, 0.14]], [1150, 'tick', [1.6, 0.14]], [1300, 'tick', [1.6, 0.14]],  // linhas de texto
    [1100, 'tick', [1.00, 0.28]], [1190, 'tick', [1.15, 0.28]], [1290, 'tick', [0.90, 0.28]],
    [1410, 'tick', [1.10, 0.28]], [1560, 'tick', [0.95, 0.28]], [1740, 'tick', [1.05, 0.28]],
    [1960, 'tick', [0.90, 0.28]],                // engrenagens girando
    [2000, 'chime', [0.12]]                      // logo completa
  ];

  /* ===================== CONTROLE DA INTRO ===================== */
  var root = document.documentElement;
  var template = document.getElementById('gv-intro').cloneNode(true);
  var el = document.getElementById('gv-intro');
  var timers = [], finished = false;

  function seen() { try { return sessionStorage.getItem('gvIntroSeen') === '1'; } catch (e) { return false; } }
  function at(ms, fn) { timers.push(setTimeout(function () { SOUND.play(fn); }, ms)); }

  function bindSoundButton() {
    var btn = el.querySelector('.gv-snd');
    if (!btn) return;
    if (!SOUND.available()) { btn.style.display = 'none'; return; }
    var ico = btn.querySelector('.gv-snd-ico'), txt = btn.querySelector('.gv-snd-txt');
    function paint() {
      var run = SOUND.running(), on = run && !SOUND.isMuted();
      ico.textContent = on ? '🔊' : '🔇';
      txt.textContent = !run ? 'Ativar som' : (on ? '' : 'Som desligado');
      btn.classList.toggle('gv-snd-hint', !run);
    }
    btn.addEventListener('click', function (e) {
      e.stopPropagation();                  // não conta como "pular a intro"
      if (!SOUND.running()) { SOUND.setMuted(false); SOUND.resume().then(paint); }
      else { SOUND.setMuted(!SOUND.isMuted()); }

    SOUND.init(); SOUND.newBus(); bindSoundButton();
    root.classList.add('gv-lock');
    root.classList.remove('gv-ready');
    void el.offsetWidth;                  // força o navegador a aplicar o estado inicial
    el.classList.add('gv-run');
    el.addEventListener('click', exit);   // clicar pula a intro

    // sons da entrada, na mesma hora das animações
    INTRO_SOUNDS.forEach(function (s) {
      at(s[0], function (c, o, t) { SOUND.fx[s[1]].apply(null, [c, o, t].concat(s[2])); });
    });

    var minTime = new Promise(function (r) { timers.push(setTimeout(r, CONFIG.minShow)); });
    var loaded  = new Promise(function (r) {
      if (document.readyState === 'complete') r(); else window.addEventListener('load', r, { once: true });
    });
    var cap = new Promise(function (r) { timers.push(setTimeout(r, CONFIG.maxWait)); });
    Promise.all([minTime, Promise.race([loaded, cap])]).then(exit);
  }

  window.gvIntro = {
    sound: SOUND.fx, timing: T, intro: INTRO_SOUNDS, exitSound: exitSound, volume: CONFIG.volume,
    replay: function () {                 // window.gvIntro.replay() roda a intro de novo
      timers.forEach(clearTimeout); timers = [];
      if (el && el.parentNode) el.parentNode.removeChild(el);
      el = template.cloneNode(true);
      document.body.insertBefore(el, document.body.firstChild);
      start();
    }
  };

  start();
  // só neste arquivo de prévia: repete a animação sozinha (apague estas 2 linhas no site)
  window.addEventListener('gv-intro-done', function () { setTimeout(function () { window.gvIntro.replay(); }, 1500); });
})();
</script>
